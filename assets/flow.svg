<svg xmlns="http://www.w3.org/2000/svg" width="860" height="132" viewBox="0 0 860 132" role="img" aria-label="Interface to service to pipeline to store — the path data takes through the systems I build">
  <style>
    .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; letter-spacing: 1.6px; fill: #8B949E; }
    .cap { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; letter-spacing: 2.4px; fill: #5B6570; }
    .stn { fill: #11161D; stroke: #E2B26E; stroke-width: 2; }
    .dot { fill: #E2B26E; }
  </style>
  <rect width="860" height="132" rx="10" fill="#11161D"/>
  <text class="cap" x="34" y="30">THE PATH DATA TAKES</text>

  <line x1="70" y1="72" x2="790" y2="72" stroke="#2A323C" stroke-width="2"/>

  <circle class="stn" cx="70"  cy="72" r="7"/>
  <circle class="stn" cx="310" cy="72" r="7"/>
  <circle class="stn" cx="550" cy="72" r="7"/>
  <circle class="stn" cx="790" cy="72" r="7"/>

  <text class="lbl" x="70"  y="103" text-anchor="middle">REACT</text>
  <text class="lbl" x="310" y="103" text-anchor="middle">NODE / FLASK</text>
  <text class="lbl" x="550" y="103" text-anchor="middle">AIRFLOW · DBT</text>
  <text class="lbl" x="790" y="103" text-anchor="middle">POSTGRES</text>

  <circle class="dot" cx="70" cy="72" r="4">
    <animate attributeName="cx" values="70;790" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot" cx="70" cy="72" r="4">
    <animate attributeName="cx" values="70;790" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot" cx="70" cy="72" r="4">
    <animate attributeName="cx" values="70;790" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
